resources:
  jobs:
    worldcup_medallion_pipeline:
      name: wf_worldcup_${var.environment}

      parameters:
        - name: environment
          default: ${var.environment}

        - name: storage_account
          default: ${var.storage_account}

      tasks:
        - task_key: prepare_environment
          notebook_task:
            notebook_path: ../prepAmb/00_prepare_environment.py
            base_parameters:
              environment: ${var.environment}
              storage_account: ${var.storage_account}
          environment_key: default

        - task_key: bronze_ingestion
          depends_on:
            - task_key: prepare_environment
          notebook_task:
            notebook_path: ../proceso/01_bronze_ingestion.py
            base_parameters:
              environment: ${var.environment}
              storage_account: ${var.storage_account}
          environment_key: default

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../proceso/02_silver_transform.py
            base_parameters:
              environment: ${var.environment}
              storage_account: ${var.storage_account}
          environment_key: default

        - task_key: gold_load
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../proceso/03_gold_load.py
            base_parameters:
              environment: ${var.environment}
              storage_account: ${var.storage_account}
          environment_key: default

        - task_key: grants
          depends_on:
            - task_key: gold_load
          notebook_task:
            notebook_path: ../seguridad/01_grants.py
            base_parameters:
              environment: ${var.environment}
              principal: jlozanom2001@alumno.ipn.mx
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"